version: "3.9"

services:
  # ─── Redis ───────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: trendio_redis
    restart: unless-stopped
    ports:
      - "6380:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Django Backend ──────────────────────────────────────
  # DATABASE_URL comes from .env (your real Neon connection string) —
  # do NOT hardcode it here, and do NOT commit the real value to git.
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        INSTALL_DEV: "true"
    container_name: trendio_backend
    restart: unless-stopped
    volumes:
      - .:/app
      - media_data:/app/media
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      REDIS_URL: redis://redis:6379/0
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    ports:
      - "8000:8000"
    depends_on:
      redis:
        condition: service_healthy

  # ─── Celery Worker ───────────────────────────────────────
  celery:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        INSTALL_DEV: "true"
    container_name: trendio_celery
    restart: unless-stopped
    command: celery -A config worker --loglevel=info --concurrency=4
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - redis

  # ─── Celery Beat (Scheduler) ─────────────────────────────
  celery-beat:
    build:
      context: .
      dockerfile: docker/Dockerfile
      args:
        INSTALL_DEV: "true"
    container_name: trendio_celery_beat
    restart: unless-stopped
    command: celery -A config beat --loglevel=info
    volumes:
      - .:/app
    env_file:
      - .env
    environment:
      DJANGO_SETTINGS_MODULE: config.settings.dev
      CELERY_BROKER_URL: redis://redis:6379/1
      CELERY_RESULT_BACKEND: redis://redis:6379/2
    depends_on:
      - redis

  # ─── React Frontend ──────────────────────────────────────
  # VITE_* vars are baked in at BUILD time, not runtime — passed as
  # build args below. Docker Compose auto-loads a root-level ".env"
  # file (next to this docker-compose.yml) for ${...} substitution,
  # so put your VITE_* values there.
  frontend:
    build:
      context: ../frontend
      dockerfile: docker/Dockerfile
      args:
        VITE_API_BASE_URL: ${VITE_API_BASE_URL}
        VITE_RAZORPAY_KEY_ID: ${VITE_RAZORPAY_KEY_ID}
        VITE_APP_NAME: ${VITE_APP_NAME}
        VITE_APP_ENV: ${VITE_APP_ENV}
        VITE_AI_BASE_URL: ${VITE_AI_BASE_URL}
        VITE_AI_SECRET_KEY: ${VITE_AI_SECRET_KEY}
        VITE_GOOGLE_CLIENT_ID: ${VITE_GOOGLE_CLIENT_ID}
    container_name: trendio_frontend
    restart: unless-stopped
    ports:
      - "5173:80"
    depends_on:
      - backend

volumes:
  media_data: